    <p class="sub">Write **bold** for bold and *word* for the accent colour. Lists take one item per line. Keep it to about 22 words.</p></div>
  <div class="pane"><div class="row" id="edSize"></div><div class="row" id="edPos" style="justify-content:center;gap:6px;flex-wrap:wrap;margin:6px 0"><span class="sub" style="width:100%;text-align:center">Drag the words, the pack or the button on the preview to move them (saved for this size).</span><button data-al="left">Left</button><button data-al="center">Centre</button><button data-al="right">Right</button><button data-al="reset">Reset placement and size</button></div><div class="row" id="edFs" style="justify-content:center;gap:4px 10px;flex-wrap:wrap;margin:0 0 6px"></div><div class="stage" id="stage"><iframe id="frame" title="Preview"></iframe></div><div id="live"></div>
    <div class="row" style="justify-content:center"><button class="primary" id="save">Save</button><button id="export">Export PNG</button><button id="exportAll">Export all sizes</button><button id="del" hidden>Delete</button></div><p class="status" id="edMsg" style="text-align:center"></p></div>
</div></dialog>

<script type="module">
import { render, fileName, SIZES, THEMES, TEMPLATES, SCENES, checkCopy, wordCount, TEXT_LIMIT, batchPrompt, META_FIELDS, BRAND_BRIEF, MOVE, MOVE_NAMES } from "/engine.js";
import { inspirationFor, inspirationIdea } from "/inspiration.js";
import { STATICS } from "/statics.js";
import { openImgEditor } from "/imgedit.js";

const TABS = [["IDEAS", "1 · Ideas"], ["AIAPP", "2 · AI Checker"], ["TEAMAPP", "3 · Team Approval"], ["FINAL", "4 · Statics Finalized"], ["RULES", "Rules"]];
const FUN = { TOFU: "TOFU: new audience", MOFU: "MOFU: retargeting", BOFU: "BOFU: ready to buy", RET: "Retention: existing customers" };
const st = { tab: "IDEAS", prod: "all", fin: "all", size: "4x5", apf: "all", aiv: "ai_approved", sel: new Set(), items: [], rules: [], q: "", img: null, thumb: null, gCount: "6", gFunnel: "auto", gProd: "auto" };
try { const p = JSON.parse(localStorage.getItem("silt-se-ui") || "{}"); if (p.tab === "APPROVAL") p.tab = "TEAMAPP"; if (["TOFU", "MOFU", "BOFU", "RET"].includes(p.tab)) p.tab = "FINAL"; if (p.tab && TABS.some(t => t[0] === p.tab)) st.tab = p.tab; if (p.size) st.size = p.size; } catch {}
const saveUi = () => { try { localStorage.setItem("silt-se-ui", JSON.stringify({ tab: st.tab, size: st.size })); } catch {} };
const $ = id => document.getElementById(id), esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
let myName = ""; try { myName = localStorage.getItem("silt-se-name") || ""; } catch {}
let rulesKey = ""; try { rulesKey = localStorage.getItem("silt-se-rules-key") || ""; } catch {}
async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { "content-type": "application/json", "x-silt-name": encodeURIComponent(myName || "team"), "x-silt-actor": "team", ...(opts.headers || {}) } });
  const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || r.statusText); return j;
}

// ---------- data ----------
// Everything lives in the team database (team reset, 26 Nov): statics written from ideas, edited statics and uploaded
// images. The old built-in and Library sets are no longer shown; the St(temp) statics were imported as editable uploads.
const KINDS = ["static", "override", "upload"];
const asStatic = i => ({ ...i.doc, ...(i.kind === "upload" ? { kind: "upload" } : {}), _item: i });
const LIVE = i => i.status === "approved";
// The AI Checker's verdict: approved moves on to Team Approval by itself; stalled waits in the AI Checker tab.
const AI = i => i.status === "ai_approved" || i.status === "ai_rejected";
const PENDING = i => ["approval", "changes", "active", "ai_approved"].includes(i.status) || (i.status === "draft" && !i.doc?.idea_id);
const aiList = () => st.items.filter(i => KINDS.includes(i.kind) && AI(i)).map(i => ({ ...asStatic(i), _verdict: i.status }));
const pending = () => st.items.filter(i => KINDS.includes(i.kind) && PENDING(i)).map(asStatic);
const allStatics = () => st.items.filter(i => KINDS.includes(i.kind) && LIVE(i)).map(asStatic);
const ideas = () => st.items.filter(i => i.kind === "idea" && i.status !== "archived");
const isImg = s => s.kind === "upload" || !!(s.files && Object.keys(s.files).length);
const imgUrl = (s, k) => "/api/file/" + s.files[k];
const imgName = (s, k) => s.names?.[k] || s.files[k] + ".jpg";
const findAny = id => { const it = st.items.find(i => i.id === id && KINDS.includes(i.kind)); return it ? asStatic(it) : null; };
async function load() {
  // If the API is down (e.g. Cloudflare's daily free limit), keep the built-in statics usable instead of breaking the page.
  try { const r = await api("/api/items"); if (!r || !Array.isArray(r.items)) throw new Error("the team database isn't answering"); st.items = r.items; } catch (e) { st.items = st.items || []; status("Team items couldn't load (" + e.message + "). Everything comes back when it answers again."); }
  try { st.rules = (await api("/api/rules")).rules || []; } catch {}
  draw();
}

// ---------- shell ----------
function drawTabs() {
  const n = id => id === "IDEAS" ? ideas().filter(i => !allDropped(i)).length : id === "RULES" ? st.rules.length : id === "TEAMAPP" ? pending().length : id === "AIAPP" ? aiList().length : allStatics().length;
  $("tabs").innerHTML = TABS.map(([id, name]) => `<button data-tab="${id}" aria-pressed="${st.tab === id}">${name} <span class="sub">${n(id)}</span></button>`).join("");
}
$("tabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (!b) return; st.tab = b.dataset.tab; st.sel.clear(); st.apf = st.prod = st.fin = "all"; saveUi(); draw(); });
function draw() {
  for (const k of [...st.sel]) if (!st.items.some(i => i.id === k)) st.sel.delete(k);
  drawTabs(); (st.tab === "IDEAS" ? drawIdeas : st.tab === "RULES" ? drawRules : st.tab === "TEAMAPP" ? () => drawApproval("TEAM") : st.tab === "AIAPP" ? () => drawApproval("AI") : drawFinal)(); hydrate(); drawSelBar();
}
function status(t) { const el = $("genMsg") || $("zipMsg"); if (el) el.textContent = t; }
const chips = (key, opts) => opts.map(([v, l]) => `<button data-k="${key}" data-v="${v}" aria-pressed="${st[key] === v}">${l}</button>`).join("");

function thumb(s, size = st.size) {
  const z = SIZES[size];
  if (isImg(s)) { const k = s.files[size] ? size : (s.files["4x5"] ? "4x5" : Object.keys(s.files)[0]); const zz = SIZES[k]; return `<div class="thumb" data-z="${k}" style="aspect-ratio:${zz ? zz.w + "/" + zz.h : "4/5"}"><img loading="lazy" src="${imgUrl(s, k)}" alt="${esc(s.title)}"></div>`; }
  if (s._item) return `<div class="thumb" data-z="${size}" data-live="${esc(s._item.id)}" data-size="${size}" style="aspect-ratio:${z.w}/${z.h}"></div>`;
  return `<div class="thumb" data-z="${size}" style="aspect-ratio:${z.w}/${z.h}"><img loading="lazy" src="/thumb/${fileName(s, size)}.jpg" alt="${esc(s.id)}"></div>`;
}
function hydrate() {
  document.querySelectorAll("[data-live]").forEach(el => {
    const s = findAny(el.dataset.live); if (!s) return; const z = SIZES[el.dataset.size || st.size];
    const f = document.createElement("iframe"); f.style.width = z.w + "px"; f.style.height = z.h + "px"; f.style.transform = `scale(${el.clientWidth / z.w})`; f.srcdoc = render(s, el.dataset.size || st.size, "/"); f.title = s.id; el.appendChild(f);
  });
}

async function shrink(file, max, q) {
  const img = await createImageBitmap(file); const sc = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement("canvas"); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", q);
}

    + `<li><b>Actions</b> → Create new action → <b>Import from URL</b>: <code>${location.origin}/team-ai/openapi.json</code>. Authentication: <b>None</b>. Save.</li>`
    + `<li>Open the GPT and say <b>“${say}”</b>. The first time, ChatGPT asks to talk to silt-static-engine.pages.dev: click <b>Always allow</b>. This window ticks ✓.</li>`
    + '<li><b>Still ○?</b> The site never heard from your GPT: the action is missing, Authentication isn\'t None, “Allow” wasn\'t clicked, or you used normal ChatGPT instead of the SILT GPT.</li>'
    + '<li><b>No custom GPT?</b> Let Claude do it: with <b>Claude in Chrome</b>, Claude opens chatgpt.com in your browser, makes each image from its prompt and uploads it. That ticks ChatGPT here too (through Claude).</li></ol></details>'
    + `<p class="sub" style="margin:0">Already set up with the old skill or GPT? Just tell it <b>“${say}”</b> <button id="wCopy" style="padding:2px 10px">Copy</button>. Your code: <span class="code">${myCode}</span></p>`
    + '<div class="row"><span class="sub">This window checks every few seconds.</span><span class="spacer"></span><button class="primary" id="wLater">Close</button></div></div>';
  document.body.appendChild(d); d.showModal();
  const poll = setInterval(() => { if (!document.hidden) checkConn(); }, 8000);
  const close = () => { clearInterval(poll); try { sessionStorage.setItem("silt-se-later", "1"); } catch {} if (d.open) d.close(); d.remove(); };
  d.addEventListener("cancel", () => { clearInterval(poll); try { sessionStorage.setItem("silt-se-later", "1"); } catch {} setTimeout(() => d.remove(), 0); });
  d.querySelector("#wX").onclick = close;
  d.querySelector("#wLater").onclick = close;
  d.querySelector("#wCopy").onclick = async () => { try { await navigator.clipboard.writeText(say); d.querySelector("#wCopy").textContent = "Copied"; } catch { prompt("Copy this:", say); } };
  d.querySelector("#wSkill").onclick = async e => { e.target.disabled = true; try { await downloadMySkill(); e.target.textContent = "✓ Downloaded. Now upload it in Claude"; } catch (er) { e.target.textContent = "Couldn't build it: " + er.message; } e.target.disabled = false; };
  d.querySelector("#wGpt").onclick = async e => { try { await navigator.clipboard.writeText(await myGptInstructions()); e.target.textContent = "✓ Copied. Paste into your GPT's Instructions"; } catch (er) { prompt("Copy these instructions:", await myGptInstructions()); } };
}
// The SILT skill with this browser's code inside: every call it makes sends the code, so the site knows this person's
// Claude is connected without anyone typing anything.
async function downloadMySkill() {
  if (!window.JSZip) throw new Error("ZIP library didn't load; reload the page");
  let md = await (await fetch("/team-ai/skill/SKILL.md", { cache: "no-store" })).text();
  md = md.replaceAll('-H "x-silt-client: claude"', `-H "x-silt-client: claude" -H "x-silt-code: ${myCode}"`)
    .replace("# SILT Static Engine: Claude is the thinker", `# SILT Static Engine: Claude is the thinker\n\n**This skill is paired with ${myName || "your"} browser (code ${myCode}).** Every call below sends that code, so the site shows ✓ Claude connected on its own. Use the calls exactly as written.`)
    .replaceAll("ABC234", myCode);
  const z = new JSZip(); z.folder("silt-static-engine").file("SKILL.md", md);
  save(await z.generateAsync({ type: "blob" }), "silt-static-engine-skill.zip");
}
async function myGptInstructions() {
  const t = await (await fetch("/team-ai/GPT_INSTRUCTIONS.txt", { cache: "no-store" })).text();
  return `YOUR SILT CODE: ${myCode}. At the start of every conversation, before anything else, quietly call connectBrowser with code "${myCode}" and client "chatgpt" (only mention it if it fails).\n\n` + t;
}
</script></body></html>
