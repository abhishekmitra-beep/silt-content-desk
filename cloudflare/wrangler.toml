name = "silt-content-desk"
pages_build_output_dir = "public"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "silt_desk"
database_id = "722c1c48-c0f8-4c54-ae5a-5a8c313274bf"

# Login uses two Pages secrets (never put them in this file):
#   DESK_PASSWORD   the shared team password
#   SESSION_SECRET  random key that signs login cookies
# Set them with scripts/set-password.mjs. Changing DESK_PASSWORD signs everyone out.

# The content agent runs through ChatGPT Plus (copy, paste, upload). Set to "api" to use the OpenAI API with credits.
[vars]
AGENT_MODE = "plus"
# "1" = no password: anyone with the link can view and edit (set 26 Nov 2026 at the team's request). "0" brings the login back.
DESK_OPEN = "1"
